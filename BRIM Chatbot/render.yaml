# Render blueprint for the BRIM AI backend.
#
# In Render: New -> Blueprint -> connect this repository -> Apply. Render reads this file and
# creates the web service with the right root directory, Dockerfile and environment variables.
# Variables marked `sync: false` are prompted for during setup and never stored in git.
#
# Note on uploads: persistent disks require a paid instance type, so none is declared here.
# Extracted text and embeddings live in Postgres, so knowledge answers survive restarts; only
# the original uploaded file (the Inspect view) is lost on redeploy. Add a disk mounted at
# /app/uploads once you are on a paid plan.
services:
  - type: web
    name: brim-api
    runtime: docker
    rootDir: BRIM Chatbot/backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Generated once by Render and kept stable across deploys. The app refuses to boot in
      # production with the built-in default secret.
      - key: SECRET_KEY
        generateValue: true
      # postgresql+psycopg2://user:pass@host/db?sslmode=require  (from Neon)
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # The deployed frontend origin, e.g. https://brim-ai.vercel.app
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: ALLOW_SQLITE_FALLBACK
        value: "false"
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: RATE_LIMIT_ENABLED
        value: "true"
