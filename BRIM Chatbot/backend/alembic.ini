# Alembic configuration for BRIM AI.
#
# The database URL is NOT set here: migrations/env.py reads it from the application settings
# (app.core.config) so that .env / environment variables stay the single source of truth.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Timestamped revision filenames keep the versions/ directory readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
