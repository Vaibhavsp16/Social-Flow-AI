server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache fingerprinted build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app uses client-side routing (BrowserRouter), so unknown paths must fall back to
    # index.html rather than returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
